name: "Master Deploy: ArthaPay Platform"

on:
  workflow_dispatch:
    inputs:
      # --- 1. Client & Environment ---
      client_name:
        description: "Client name (e.g., Artha, demo)"
        type: string
        required: true
        default: "Artha"
      environment:
        description: "Environment (tst, stg, prd)"
        type: choice
        options:
          - tst
          - stg
          - prd
        default: "tst"
      
      # --- 2. Module Selection ---
      # Used by Terraform to determine which Backend Web Apps to create
      backend_modules_to_deploy:
        description: "Modules to deploy (e.g., 'all','coreapi','cardsapi','banksapi','paymentsapi','paylinks','signalR','api','exchangeapi','integration')"
        type: string
        default: "all"
        
      

jobs:
  # ===================================================================
  # JOB 1: INFRASTRUCTURE (Terraform)
  # ===================================================================
  deploy-infra:
    name: "Job 1: Deploy Infrastructure"
    uses: ./.github/workflows/callable-deploy-infra.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      backend_modules: ${{ github.event.inputs.backend_modules_to_deploy }}
      # We construct the admin username automatically
      vm_admin_username: "${{ github.event.inputs.client_name }}${{ github.event.inputs.environment }}admin"
    
    # PASS ALL SECRETS HERE
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
      APP_SQL_PASSWORD: ${{ secrets.APP_SQL_PASSWORD }}
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      
      # --- NEW SECRETS ---
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_SERVICE_ID: ${{ secrets.TWILIO_SERVICE_ID }}
      SUMSUB_APP_TOKEN: ${{ secrets.SUMSUB_APP_TOKEN }}
      SUMSUB_SECRET_KEY: ${{ secrets.SUMSUB_SECRET_KEY }}
      POWERBI_PASSWORD: ${{ secrets.POWERBI_PASSWORD }}
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
      TOKEN_ENCRYPT_KEY: ${{ secrets.TOKEN_ENCRYPT_KEY }}
      REDIS_CONNECTION: ${{ secrets.REDIS_CONNECTION }}
      VAULT_DB_CONNECTION: ${{ secrets.VAULT_DB_CONNECTION }}
      GENERAL_API_KEY: ${{ secrets.GENERAL_API_KEY }}
      GENERAL_API_SECRET: ${{ secrets.GENERAL_API_SECRET }}
      CLIENT_SECRET_VALUE: ${{ secrets.CLIENT_SECRET_VALUE }}
      EASYLINK_APP_KEY: ${{ secrets.EASYLINK_APP_KEY }}
      EASYLINK_APP_SECRET: ${{ secrets.EASYLINK_APP_SECRET }}
      AML_ACCESS_KEY: ${{ secrets.AML_ACCESS_KEY }}
      APP_PASSWORD_CLEAR: ${{ secrets.APP_PASSWORD_CLEAR }}
      APP_PASSWORD_HASH: ${{ secrets.APP_PASSWORD_HASH }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      APP_PUBLIC_KEY: ${{ secrets.APP_PUBLIC_KEY }}
      RESTSHARP_ACCESS_TOKEN: ${{ secrets.RESTSHARP_ACCESS_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      CORE_MAIN_ACCOUNT_ID: ${{ secrets.CORE_MAIN_ACCOUNT_ID }}
      CORE_EXTERNAL_BASE_URL: ${{ secrets.CORE_EXTERNAL_BASE_URL }}
      AUTH0_MOBILE_CLIENT_ID: ${{ secrets.AUTH0_MOBILE_CLIENT_ID }}
      SENDGRID_TEMPLATE_ID: ${{ secrets.SENDGRID_TEMPLATE_ID }}
      AML_ACCESS_ID: ${{ secrets.AML_ACCESS_ID }}
      FIREBASE_SERVER_KEY: ${{ secrets.FIREBASE_SERVER_KEY }}
      COLLECTION_VAULT_ID: ${{ secrets.COLLECTION_VAULT_ID }}
      POLYGON_WALLET_ADDRESS: ${{ secrets.POLYGON_WALLET_ADDRESS }}
      TRON_WALLET_ADDRESS: ${{ secrets.TRON_WALLET_ADDRESS }}
      MARKET_ADMIN_EMAIL: ${{ secrets.MARKET_ADMIN_EMAIL }}
      MARKET_BCC_EMAILS: ${{ secrets.MARKET_BCC_EMAILS }}
      MARKET_EXCHANGE_URL: ${{ secrets.MARKET_EXCHANGE_URL }}
      MARKET_LOGIN_URL: ${{ secrets.MARKET_LOGIN_URL }}
      AYOLINX_PRIVATE_KEY: ${{ secrets.AYOLINX_PRIVATE_KEY }}
      AYOLINX_CUSTOMER_TOKEN: ${{ secrets.AYOLINX_CUSTOMER_TOKEN }}
      AYOLINX_BASE_URL: ${{ secrets.AYOLINX_BASE_URL }}
      PYRROS_CLIENT_ID: ${{ secrets.PYRROS_CLIENT_ID }}
      PYRROS_CLIENT_SECRET: ${{ secrets.PYRROS_CLIENT_SECRET }}
      PYRROS_URL: ${{ secrets.PYRROS_URL }}
      SENDGRID_AUTH_TOKEN: ${{ secrets.SENDGRID_AUTH_TOKEN }}
      SENDGRID_ACCOUNT_SID: ${{ secrets.SENDGRID_ACCOUNT_SID }}
      SENDGRID_SERVICE_ID: ${{ secrets.SENDGRID_SERVICE_ID }}
      WEB3_API_KEY: ${{ secrets.WEB3_API_KEY }}
      WEB3_EXCHANGE_ID: ${{ secrets.WEB3_EXCHANGE_ID }}
      WEB3_PAYMENTS_ID: ${{ secrets.WEB3_PAYMENTS_ID }}
      WEB3_PAYMENT_LINK_URL: ${{ secrets.WEB3_PAYMENT_LINK_URL }}
      HYPERPAY_URL: ${{ secrets.HYPERPAY_URL }}
      COINGECKO_BASE_URL: ${{ secrets.COINGECKO_BASE_URL }}
      CARDS_PRIVATE_KEY: ${{ secrets.CARDS_PRIVATE_KEY }}
      CARDS_CUSTOMER_TOKEN: ${{ secrets.CARDS_CUSTOMER_TOKEN }}

  # ===================================================================
  # JOB 2: CONFIGURE UI
  # ===================================================================
  configure-ui:
    name: "Job 2: Configure UI Apps"
    needs: deploy-infra 
    uses: ./.github/workflows/callable-deploy-ui.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      ui_app_name: ${{ needs.deploy-infra.outputs.ui_app_name }}
      ui_admin_name: ${{ needs.deploy-infra.outputs.ui_admin_name }}
      webapp_rg_name: ${{ needs.deploy-infra.outputs.webapp_rg_name }}
      
      # We now fetch Auth0 details from Secrets inside the callable workflow, 
      # or you can pass them as secrets here too if the UI workflow needs them.
      auth0_domain: "rapidz-stg.us.auth0.com" # If static, or fetch from secret
       # Passed as input or secret
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}