name: "Master Deploy: ArthaPay Platform"

on:
  workflow_dispatch:
    inputs:
      # --- 1. Client & Environment ---
      client_name:
        description: "Client name (e.g., Artha, demo)"
        type: string
        required: true
        default: "Artha"
      client_domain_extension:
        description: "Domain Extension (e.g., work, com, ch)"
        type: string
        required: true
        default: "work"
      environment:
        description: "Environment (tst, stg, prd)"
        type: choice
        options:
          - tst
          - stg
          - prd
        default: "tst"
      
      # --- 2. Module Selection ---
      backend_modules_to_deploy:
        description: "Modules to deploy (e.g., 'all', 'core', 'core,banks')"
        type: string
        default: "all"

      # --- 3. Source Control ---
      azure_devops_repo_url:
        description: "Azure DevOps Repo URL (for cloning/tracking)"
        type: string
        required: true
        default: "https://dev.azure.com/..."
        
      # --- 4. Third-Party Config ---
      auth0_domain:
        description: "Auth0 Domain"
        type: string
        required: true
      auth0_client_id:
        description: "Auth0 Client ID"
        type: string
        required: true
      mailgun_key:
        description: "Mailgun API Key"
        type: string
        required: true
      twilio_sid:
        description: "Twilio Account SID"
        type: string
        required: true
      
      # --- TOTAL: 9 INPUTS ---

jobs:
  # ===================================================================
  # JOB 1: INFRASTRUCTURE
  # ===================================================================
  deploy-infra:
    name: "Job 1: Deploy Infrastructure"
    uses: ./.github/workflows/callable-deploy-infra.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      # Auto-generate admin user
      vm_admin_username: "${{ github.event.inputs.client_name }}${{ github.event.inputs.environment }}admin"
      auth0_domain: ${{ github.event.inputs.auth0_domain }}
      mailgun_key: ${{ github.event.inputs.mailgun_key }}
      twilio_sid: ${{ github.event.inputs.twilio_sid }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
      APP_SQL_PASSWORD: ${{ secrets.APP_SQL_PASSWORD }}

  # ===================================================================
  # JOB 2: DEPLOY UI (CONTAINER)
  # ===================================================================
  deploy-ui:
    name: "Job 2: Deploy React UI Container"
    needs: deploy-infra 
    uses: ./.github/workflows/callable-deploy-ui.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      client_domain_extension: ${{ github.event.inputs.client_domain_extension }}
      
      # --- Docker Config ---
      # Automatically names the image [client]-ui (e.g., artha-ui)
      docker_image: "${{ github.event.inputs.client_name }}-ui"
      docker_tag: "latest"
      
      # --- Source Control ---
      azure_repo_url: ${{ github.event.inputs.azure_devops_repo_url }}
      
      # --- Infra Outputs ---
      webapp_name: ${{ needs.deploy-infra.outputs.webapp_name }}
      webapp_rg_name: ${{ needs.deploy-infra.outputs.webapp_rg_name }}
      acr_login_server: ${{ needs.deploy-infra.outputs.acr_login_server }}
      acr_username: ${{ needs.deploy-infra.outputs.acr_username }}
      acr_password: ${{ needs.deploy-infra.outputs.acr_password }}
      
      # --- Auth0 ---
      auth0_domain: ${{ github.event.inputs.auth0_domain }}
      auth0_client_id: ${{ github.event.inputs.auth0_client_id }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      # This secret is required to create the ACR Task
      AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}

  # ===================================================================
  # JOB 3: DEPLOY BACKEND APIs (Disabled)
  # ===================================================================
  # deploy-backend:
  #   ... (disabled until source code is available) ...