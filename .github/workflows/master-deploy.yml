name: "Master Deploy: ArthaPay Platform"

on:
  workflow_dispatch:
    inputs:
      # --- 1. Client & Environment (2 inputs) ---
      client_name:
        description: "Client name (e.g., Artha, demo)"
        type: string
        required: true
        default: "Artha"
      environment:
        description: "Environment (tst, stg, prd)"
        type: choice
        options:
          - tst
          - stg
          - prd
        default: "tst"
      
      # --- 2. Module Selection (1 input) ---
      backend_modules_to_deploy:
        description: "Modules to deploy (e.g., 'all', 'core', 'core,banks')"
        type: string
        default: "all"
        
      # --- 3. Third-Party Config (5 inputs) ---
      auth0_domain:
        description: "Auth0 Domain"
        type: string
        required: true
      auth0_client_id:
        description: "Auth0 Client ID"
        type: string
        required: true
      mailgun_key:
        description: "Mailgun API Key"
        type: string
        required: true
      twilio_sid:
        description: "Twilio Account SID"
        type: string
        required: true
      zapier_webhook_url:
        description: "Zapier Webhook URL"
        type: string
        required: true
      # --- TOTAL: 8 INPUTS ---

jobs:
  # ===================================================================
  # JOB 1: INFRASTRUCTURE
  # ===================================================================
  deploy-infra:
    name: "Job 1: Deploy Infrastructure"
    uses: ./.github/workflows/callable-deploy-infra.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      vm_admin_username: "${{ github.event.inputs.client_name }}${{ github.event.inputs.environment }}admin"
      auth0_domain: ${{ github.event.inputs.auth0_domain }}
      mailgun_key: ${{ github.event.inputs.mailgun_key }}
      twilio_sid: ${{ github.event.inputs.twilio_sid }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}

  # ===================================================================
  # JOB 2: REACT UI
  # ===================================================================
  deploy-ui:
    name: "Job 2: Deploy React UI"
    needs: deploy-infra 
    uses: ./.github/workflows/callable-deploy-ui.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      swa_deploy_token: ${{ needs.deploy-infra.outputs.static_web_app_api_key }}
      auth0_domain: ${{ github.event.inputs.auth0_domain }}
      auth0_client_id: ${{ github.event.inputs.auth0_client_id }}
    secrets: {}

  # ===================================================================
  # JOB 3: SQL DATABASE (Temporarily Disabled)
  # ===================================================================
  # configure-sql:
  #   name: "Job 3: Configure SQL Database"
  #   needs: deploy-infra 
  #   uses: ./.github/workflows/callable-configure-sql.yml
  #   with:
  #     client_name: ${{ github.event.inputs.client_name }}
  #     environment: ${{ github.event.inputs.environment }}
  #     vm_rg_name: ${{ needs.deploy-infra.outputs.vm_rg_name }}
  #     vm_name: ${{ needs.deploy-infra.outputs.vm_name }}
  #     vm_admin_username: "${{ github.event.inputs.client_name }}${{ github.event.inputs.environment }}admin"
  #   secrets:
  #     AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  #     VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
  #     APP_SQL_PASSWORD: ${{ secrets.APP_SQL_PASSWORD }}

  # ===================================================================
  # JOB 4: DEPLOY BACKEND APIs
  # ===================================================================
  deploy-backend:
    name: "Job 4: Deploy .NET Backend"
    # --- FIX: Removed 'configure-sql' from the 'needs' list ---
    needs: [deploy-infra]
    uses: ./.github/workflows/callable-deploy-backend.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      modules_to_deploy: ${{ github.event.inputs.backend_modules_to_deploy }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  # ===================================================================
  # JOB 5: ZAPIER
  # ===================================================================
  trigger-zapier:
    name: "Job 5: Trigger Zapier Webhook"
    # --- FIX: Removed 'configure-sql' (it's part of deploy-backend's chain) ---
    needs: [deploy-ui, deploy-backend] 
    uses: ./.github/workflows/callable-trigger-zapier.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      app_url: ${{ needs.deploy-infra.outputs.static_web_app_url }}
    secrets:
      ZAPIER_WEBHOOK_URL: ${{ github.event.inputs.zapier_webhook_url }}