name: "Master Deploy: ArthaPay Platform"

on:
  workflow_dispatch:
    inputs:
      # --- 1. Client & Environment ---
      client_name:
        description: "Client name (e.g., Artha, demo)"
        type: string
        required: true
        default: "Artha"
      environment:
        description: "Environment (tst, stg, prd)"
        type: choice
        options:
          - tst
          - stg
          - prd
        default: "tst"
      
      # --- 2. Module Selection ---
      backend_modules_to_deploy:
        description: "Backend modules (e.g., core,banks,cards)"
        type: string
        default: "core,banks,cards"
        
      # --- 3. Passwords (Entered at Runtime) ---
      vm_admin_username:
        description: "VM Administrator Username (1-15 chars, no special chars)"
        type: string
        required: true
        default: "arthatstadmin"
      vm_admin_password:
        description: "VM Administrator Password"
        type: string
        required: true
      app_sql_password:
        description: "SQL Application User Password"
        type: string
        required: true
        
      # --- 4. Third-Party Config ---
      auth0_domain:
        description: "Auth0 Domain"
        type: string
        required: true
      auth0_client_id:
        description: "Auth0 Client ID"
        type: string
        required: true
      mailgun_key:
        description: "Mailgun API Key"
        type: string
        required: true
      twilio_sid:
        description: "Twilio Account SID"
        type: string
        required: true
      zapier_webhook_url:
        description: "Zapier Webhook URL"
        type: string
        required: true

jobs:
  # ===================================================================
  # JOB 1: INFRASTRUCTURE
  # ===================================================================
  deploy-infra:
    name: "Job 1: Deploy Infrastructure"
    uses: ./.github/workflows/callable-deploy-infra.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      vm_admin_username: ${{ github.event.inputs.vm_admin_username }}
      vm_admin_password: ${{ github.event.inputs.vm_admin_password }}
      auth0_domain: ${{ github.event.inputs.auth0_domain }}
      mailgun_key: ${{ github.event.inputs.mailgun_key }}
      twilio_sid: ${{ github.event.inputs.twilio_sid }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  # ===================================================================
  # JOB 2: REACT UI
  # ===================================================================
  deploy-ui:
    name: "Job 2: Deploy React UI"
    needs: deploy-infra 
    uses: ./.github/workflows/callable-deploy-ui.yml
    with:
      # --- THESE ARE THE INPUTS ---
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      swa_deploy_token: ${{ needs.deploy-infra.outputs.static_web_app_api_key }}
    secrets:
      # --- THIS IS THE FIX ---
      # Auth0 variables must be passed as SECRETS
      AUTH0_DOMAIN: ${{ github.event.inputs.auth0_domain }}
      AUTH0_CLIENT_ID: ${{ github.event.inputs.auth0_client_id }}

  # ===================================================================
  # JOB 3: SQL DATABASE
  # ===================================================================
  configure-sql:
    name: "Job 3: Configure SQL Database"
    needs: deploy-infra 
    uses: ./.github/workflows/callable-configure-sql.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      vm_rg_name: ${{ needs.deploy-infra.outputs.vm_rg_name }}
      vm_name: ${{ needs.deploy-infra.outputs.vm_name }}
      vm_admin_username: ${{ github.event.inputs.vm_admin_username }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      VM_ADMIN_PASSWORD: ${{ github.event.inputs.vm_admin_password }}
      APP_SQL_PASSWORD: ${{ github.event.inputs.app_sql_password }}

  # ===================================================================
  # JOB 4: ZAPIER
  # ===================================================================
  trigger-zapier:
    name: "Job 4: Trigger Zapier Webhook"
    needs: [deploy-ui, configure-sql]
    uses: ./.github/workflows/callable-trigger-zapier.yml
    with:
      client_name: ${{ github.event.inputs.client_name }}
      environment: ${{ github.event.inputs.environment }}
      app_url: ${{ needs.deploy-infra.outputs.static_web_app_url }}
    secrets:
      ZAPIER_WEBHOOK_URL: ${{ github.event.inputs.zapier_webhook_url }}