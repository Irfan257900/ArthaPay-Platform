name: "Reusable: Deploy Infrastructure"

on:
  workflow_call:
    inputs:
      client_name: { type: string, required: true }
      environment: { type: string, required: true }
      vm_admin_username: { type: string, required: true }
      
      # Module selection input
      backend_modules: { type: string, required: false, default: "all" }
    
    outputs:
      vm_rg_name:
        value: ${{ jobs.deploy-infra.outputs.vm_rg_name }}
      vm_name:
        value: ${{ jobs.deploy-infra.outputs.vm_name }}
      ui_app_name:
        value: ${{ jobs.deploy-infra.outputs.ui_app_name }}
      ui_admin_name:
        value: ${{ jobs.deploy-infra.outputs.ui_admin_name }}
      webapp_rg_name:
        value: ${{ jobs.deploy-infra.outputs.webapp_rg_name }}

    secrets:
      AZURE_CREDENTIALS: { required: true }
      VM_ADMIN_PASSWORD: { required: true }
      APP_SQL_PASSWORD: { required: true }
      AUTH0_DOMAIN: { required: true }
      AUTH0_CLIENT_ID: { required: true }
      AUTH0_CLIENT_SECRET: { required: true }
      TWILIO_ACCOUNT_SID: { required: true }
      TWILIO_AUTH_TOKEN: { required: true }
      TWILIO_SERVICE_ID: { required: true }
      SUMSUB_APP_TOKEN: { required: true }
      SUMSUB_SECRET_KEY: { required: true }
      POWERBI_PASSWORD: { required: true }
      APP_SECRET_KEY: { required: true }
      TOKEN_ENCRYPT_KEY: { required: true }
      REDIS_CONNECTION: { required: true }
      VAULT_DB_CONNECTION: { required: true }
      GENERAL_API_KEY: { required: true }
      GENERAL_API_SECRET: { required: true }
      CLIENT_SECRET_VALUE: { required: true }
      EASYLINK_APP_KEY: { required: true }
      EASYLINK_APP_SECRET: { required: true }
      AML_ACCESS_KEY: { required: true }
      APP_PASSWORD_CLEAR: { required: true }
      APP_PASSWORD_HASH: { required: true }
      APP_PRIVATE_KEY: { required: true }
      APP_PUBLIC_KEY: { required: true }
      RESTSHARP_ACCESS_TOKEN: { required: true }
      X_API_KEY: { required: true }
      CORE_MAIN_ACCOUNT_ID: { required: true }
      CORE_EXTERNAL_BASE_URL: { required: true }
      AUTH0_MOBILE_CLIENT_ID: { required: true }
      SENDGRID_TEMPLATE_ID: { required: true }
      AML_ACCESS_ID: { required: true }

jobs:
  deploy-infra:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.client_name }}-${{ inputs.environment }}

    outputs:
      vm_rg_name: ${{ steps.apply.outputs.vm_rg_name }}
      vm_name: ${{ steps.apply.outputs.vm_name }}
      ui_app_name: ${{ steps.apply.outputs.ui_app_name }}
      ui_admin_name: ${{ steps.apply.outputs.ui_admin_name }}
      webapp_rg_name: ${{ steps.apply.outputs.webapp_rg_name }}

    defaults:
      run:
        working-directory: ./infranew/environments/${{ inputs.environment }}

    steps:
      - name: "1. Check out Code"
        uses: actions/checkout@v4

      - name: "2. Log in to Azure"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "3. Setup Terraform"
        uses: hashicorp/setup-terraform@v3

      # --- NEW STEP: PROCESS MODULE SELECTION ---
      - name: "3b. Process Module Selection"
        id: modules
        shell: bash
        run: |
          INPUT="${{ inputs.backend_modules }}"
          echo "User selected: $INPUT"
          
          if [[ "$INPUT" == "all" || -z "$INPUT" ]]; then
             echo "Selection is 'all'. Leaving TF_VAR unset to use variables.tf defaults."
          else
             # Convert comma-separated string (core,cards) to JSON list (["core","cards"])
             # 1. Replace , with ","
             # 2. Wrap entire string in ["..."]
             JSON_LIST="[\"$(echo "$INPUT" | sed 's/,/","/g')\"]"
             
             echo "Formatted for Terraform: $JSON_LIST"
             # Export to GITHUB_ENV so Terraform picks it up automatically as TF_VAR_backend_modules
             echo "TF_VAR_backend_modules=$JSON_LIST" >> $GITHUB_ENV
          fi

      # --- AUTOMATED BACKEND CREATION (Existing Logic) ---
      - name: "4. Bootstrap & Init Terraform"
        shell: bash
        run: |
          echo "--- 1. CALCULATING DYNAMIC NAMES ---"
          CLIENT=$(echo "${{ inputs.client_name }}" | tr '[:upper:]' '[:lower:]')
          ENV=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          
          # Dynamic Naming Convention
          # RG: rg-demo-tst-tf
          BK_RG="rg-${CLIENT}-${ENV}-tf"
          # SA: stdemotsttf (Must be unique, lowercase, alphanumeric)
          BK_SA="st${CLIENT}${ENV}tf"
          BK_CONTAINER="tfstate"
          
          # Determine Location based on Environment
          if [ "$ENV" == "prd" ]; then
            LOCATION="switzerlandnorth"
          else
            LOCATION="southeastasia"
          fi
          
          echo "Target Resource Group: $BK_RG"
          echo "Target Storage Account: $BK_SA"
          echo "Target Location: $LOCATION"

          echo "--- 2. CHECKING/CREATING BACKEND RESOURCES ---"
          
          # Create Resource Group if missing
          if [ $(az group exists --name $BK_RG) = false ]; then
            echo "Creating Resource Group: $BK_RG..."
            az group create --name $BK_RG --location $LOCATION
          else
            echo "Resource Group $BK_RG already exists."
          fi

          # Check/Create Storage Account
          SA_CHECK=$(az storage account list --resource-group $BK_RG --query "[?name=='$BK_SA']" -o tsv)
          
          if [ -z "$SA_CHECK" ]; then
            echo "Creating Storage Account: $BK_SA..."
            az storage account create --resource-group $BK_RG --name $BK_SA --sku Standard_LRS --encryption-services blob
          else
            echo "Storage Account $BK_SA already exists."
          fi

          # Get Storage Account Key
          ACCOUNT_KEY=$(az storage account keys list --resource-group $BK_RG --account-name $BK_SA --query '[0].value' -o tsv)

          # Create Container if missing
          exists=$(az storage container exists --name $BK_CONTAINER --account-name $BK_SA --account-key $ACCOUNT_KEY --query exists)
          if [ "$exists" == "false" ]; then
            echo "Creating Container: $BK_CONTAINER..."
            az storage container create --name $BK_CONTAINER --account-name $BK_SA --account-key $ACCOUNT_KEY
          else
             echo "Container $BK_CONTAINER already exists."
          fi

          echo "--- 3. INITIALIZING TERRAFORM ---"
          STATE_KEY="${{ inputs.client_name }}-${{ inputs.environment }}.terraform.tfstate"
          
          terraform init \
            -backend-config="resource_group_name=$BK_RG" \
            -backend-config="storage_account_name=$BK_SA" \
            -backend-config="container_name=$BK_CONTAINER" \
            -backend-config="key=$STATE_KEY"

      - name: "5. Terraform Plan"
        env:
          TF_VAR_client_name: ${{ inputs.client_name }}
          TF_VAR_environment_name: ${{ inputs.environment }}
          TF_VAR_vm_admin_username: ${{ inputs.vm_admin_username }}
          
          # Secrets
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_app_sql_password: ${{ secrets.APP_SQL_PASSWORD }}
          TF_VAR_auth0_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
          TF_VAR_auth0_domain: ${{ secrets.AUTH0_DOMAIN }}
          TF_VAR_auth0_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TF_VAR_twilio_service_id: ${{ secrets.TWILIO_SERVICE_ID }}
          TF_VAR_sumsub_app_token: ${{ secrets.SUMSUB_APP_TOKEN }}
          TF_VAR_sumsub_secret_key: ${{ secrets.SUMSUB_SECRET_KEY }}
          TF_VAR_powerbi_password: ${{ secrets.POWERBI_PASSWORD }}
          TF_VAR_app_secret_key: ${{ secrets.APP_SECRET_KEY }}
          TF_VAR_token_encrypt_key: ${{ secrets.TOKEN_ENCRYPT_KEY }}
          TF_VAR_redis_connection_string: ${{ secrets.REDIS_CONNECTION }}
          TF_VAR_vault_db_connection_string: ${{ secrets.VAULT_DB_CONNECTION }}
          TF_VAR_general_api_key: ${{ secrets.GENERAL_API_KEY }}
          TF_VAR_general_api_secret_key: ${{ secrets.GENERAL_API_SECRET }}
          TF_VAR_client_secret_value: ${{ secrets.CLIENT_SECRET_VALUE }}
          TF_VAR_easylink_app_key: ${{ secrets.EASYLINK_APP_KEY }}
          TF_VAR_easylink_app_secret: ${{ secrets.EASYLINK_APP_SECRET }}
          TF_VAR_aml_access_key: ${{ secrets.AML_ACCESS_KEY }}
          TF_VAR_app_password_clear: ${{ secrets.APP_PASSWORD_CLEAR }}
          TF_VAR_app_password_hash: ${{ secrets.APP_PASSWORD_HASH }}
          TF_VAR_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          TF_VAR_app_public_key: ${{ secrets.APP_PUBLIC_KEY }}
          TF_VAR_restsharp_access_token: ${{ secrets.RESTSHARP_ACCESS_TOKEN }}
          TF_VAR_x_api_key: ${{ secrets.X_API_KEY }}
          TF_VAR_core_main_account_id: ${{ secrets.CORE_MAIN_ACCOUNT_ID }}
          TF_VAR_core_external_base_url: ${{ secrets.CORE_EXTERNAL_BASE_URL }}
          TF_VAR_auth0_mobile_client_id: ${{ secrets.AUTH0_MOBILE_CLIENT_ID }}
          TF_VAR_sendgrid_template_id: ${{ secrets.SENDGRID_TEMPLATE_ID }}
          TF_VAR_aml_access_id: ${{ secrets.AML_ACCESS_ID }}


        run: terraform plan -out=tfplan

      - name: "6. Terraform Apply"
        id: apply
        env:
          TF_VAR_client_name: ${{ inputs.client_name }}
          TF_VAR_environment_name: ${{ inputs.environment }}
          TF_VAR_vm_admin_username: ${{ inputs.vm_admin_username }}
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_app_sql_password: ${{ secrets.APP_SQL_PASSWORD }}
          TF_VAR_auth0_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
          TF_VAR_auth0_domain: ${{ secrets.AUTH0_DOMAIN }}
          TF_VAR_auth0_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TF_VAR_twilio_service_id: ${{ secrets.TWILIO_SERVICE_ID }}
          TF_VAR_sumsub_app_token: ${{ secrets.SUMSUB_APP_TOKEN }}
          TF_VAR_sumsub_secret_key: ${{ secrets.SUMSUB_SECRET_KEY }}
          TF_VAR_powerbi_password: ${{ secrets.POWERBI_PASSWORD }}
          TF_VAR_app_secret_key: ${{ secrets.APP_SECRET_KEY }}
          TF_VAR_token_encrypt_key: ${{ secrets.TOKEN_ENCRYPT_KEY }}
          TF_VAR_redis_connection_string: ${{ secrets.REDIS_CONNECTION }}
          TF_VAR_vault_db_connection_string: ${{ secrets.VAULT_DB_CONNECTION }}
          TF_VAR_general_api_key: ${{ secrets.GENERAL_API_KEY }}
          TF_VAR_general_api_secret_key: ${{ secrets.GENERAL_API_SECRET }}
          TF_VAR_client_secret_value: ${{ secrets.CLIENT_SECRET_VALUE }}
          TF_VAR_easylink_app_key: ${{ secrets.EASYLINK_APP_KEY }}
          TF_VAR_easylink_app_secret: ${{ secrets.EASYLINK_APP_SECRET }}
          TF_VAR_aml_access_key: ${{ secrets.AML_ACCESS_KEY }}
          TF_VAR_app_password_clear: ${{ secrets.APP_PASSWORD_CLEAR }}
          TF_VAR_app_password_hash: ${{ secrets.APP_PASSWORD_HASH }}
          TF_VAR_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          TF_VAR_app_public_key: ${{ secrets.APP_PUBLIC_KEY }}
          TF_VAR_restsharp_access_token: ${{ secrets.RESTSHARP_ACCESS_TOKEN }}
          TF_VAR_x_api_key: ${{ secrets.X_API_KEY }}
          TF_VAR_core_main_account_id: ${{ secrets.CORE_MAIN_ACCOUNT_ID }}
          TF_VAR_core_external_base_url: ${{ secrets.CORE_EXTERNAL_BASE_URL }}
          TF_VAR_auth0_mobile_client_id: ${{ secrets.AUTH0_MOBILE_CLIENT_ID }}
          TF_VAR_sendgrid_template_id: ${{ secrets.SENDGRID_TEMPLATE_ID }}
          TF_VAR_aml_access_id: ${{ secrets.AML_ACCESS_ID }}

        run: |
          terraform apply -auto-approve tfplan
          
          echo "vm_name=$(terraform output -raw vm_name)" >> $GITHUB_OUTPUT
          echo "vm_rg_name=$(terraform output -raw vm_rg_name)" >> $GITHUB_OUTPUT
          echo "ui_app_name=$(terraform output -raw ui_app_name)" >> $GITHUB_OUTPUT
          echo "ui_admin_name=$(terraform output -raw ui_admin_name)" >> $GITHUB_OUTPUT
          echo "webapp_rg_name=$(terraform output -raw webapp_rg_name)" >> $GITHUB_OUTPUT