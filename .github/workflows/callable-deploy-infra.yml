name: "Reusable: Deploy Infrastructure"

on:
  workflow_call:
    inputs:
      client_name: { type: string, required: true }
      environment: { type: string, required: true }
      vm_admin_username: { type: string, required: true }
      auth0_domain: { type: string, required: true }
      mailgun_key: { type: string, required: true }
      twilio_sid: { type: string, required: true }
    
    outputs:
      # --- OUTPUTS (All Lowercase) ---
      vm_rg_name:
        value: ${{ jobs.deploy-infra.outputs.vm_rg_name }}
      vm_name:
        value: ${{ jobs.deploy-infra.outputs.vm_name }}
      webapp_name:
        value: ${{ jobs.deploy-infra.outputs.webapp_name }}
      webapp_rg_name:
        value: ${{ jobs.deploy-infra.outputs.webapp_rg_name }}
      acr_login_server:
        value: ${{ jobs.deploy-infra.outputs.acr_login_server }}
      acr_username:
        value: ${{ jobs.deploy-infra.outputs.acr_username }}
      acr_password:
        value: ${{ jobs.deploy-infra.outputs.acr_password }}

    secrets:
      AZURE_CREDENTIALS: { required: true }
      VM_ADMIN_PASSWORD: { required: true }
      APP_SQL_PASSWORD: { required: true }

jobs:
  deploy-infra:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.client_name }}-${{ inputs.environment }}

    outputs:
      # --- MAP STEPS TO JOB OUTPUTS (LOWERCASE) ---
      vm_rg_name: ${{ steps.apply.outputs.vm_rg_name }}
      vm_name: ${{ steps.apply.outputs.vm_name }}
      webapp_name: ${{ steps.apply.outputs.webapp_name }}
      webapp_rg_name: ${{ steps.apply.outputs.webapp_rg_name }}
      acr_login_server: ${{ steps.apply.outputs.acr_login_server }}
      acr_username: ${{ steps.apply.outputs.acr_username }}
      acr_password: ${{ steps.apply.outputs.acr_password }}

    defaults:
      run:
        working-directory: ./infranew/environments/deploy_template

    steps:
      - name: "1. Check out Code"
        uses: actions/checkout@v4

      - name: "2. Log in to Azure"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "3. Setup Terraform"
        uses: hashicorp/setup-terraform@v3

      - name: "4. Terraform Init"
        env:
          STATE_FILE_KEY: "${{ inputs.client_name }}-${{ inputs.environment }}.terraform.tfstate"
        run: terraform init -backend-config="key=$STATE_FILE_KEY"

      - name: "5. Terraform Plan"
        env:
          TF_VAR_client_name: ${{ inputs.client_name }}
          TF_VAR_environment_name: ${{ inputs.environment }}
          TF_VAR_vm_admin_username: ${{ inputs.vm_admin_username }}
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_auth0_domain: ${{ inputs.auth0_domain }}
          TF_VAR_mailgun_key: ${{ inputs.mailgun_key }}
          TF_VAR_twilio_sid: ${{ inputs.twilio_sid }}
          TF_VAR_app_sql_password: ${{ secrets.APP_SQL_PASSWORD }}
        run: terraform plan -out=tfplan

      - name: "6. Terraform Apply"
        id: apply
        env:
          TF_VAR_client_name: ${{ inputs.client_name }}
          TF_VAR_environment_name: ${{ inputs.environment }}
          TF_VAR_vm_admin_username: ${{ inputs.vm_admin_username }}
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_auth0_domain: ${{ inputs.auth0_domain }}
          TF_VAR_mailgun_key: ${{ inputs.mailgun_key }}
          TF_VAR_twilio_sid: ${{ inputs.twilio_sid }}
          TF_VAR_app_sql_password: ${{ secrets.APP_SQL_PASSWORD }}
        run: |
          terraform apply -auto-approve tfplan
          # 2. REFRESH STATE (Crucial: Reads current Azure values into Terraform)
          echo "🔄 Refreshing Terraform State..."
          terraform refresh
          
          # 3. DEBUG: Show us the values in the logs
          echo "🔍 DEBUG: Checking Terraform Outputs..."
          terraform output
          # --- CAPTURE OUTPUTS (LOWERCASE KEYS) ---
          echo "vm_name=$(terraform output -raw vm_name)" >> $GITHUB_OUTPUT
          echo "vm_rg_name=$(terraform output -raw vm_rg_name)" >> $GITHUB_OUTPUT
          echo "webapp_name=$(terraform output -raw webapp_name)" >> $GITHUB_OUTPUT
          echo "webapp_rg_name=$(terraform output -raw webapp_rg_name)" >> $GITHUB_OUTPUT
          
          # This is the specific value causing your error. We capture it here:
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          
          # Handle Sensitive Outputs
          ACR_USER=$(terraform output -raw acr_admin_username)
          ACR_PASS=$(terraform output -raw acr_admin_password)
          echo "::add-mask::$ACR_USER"
          echo "::add-mask::$ACR_PASS"
          echo "acr_username=$ACR_USER" >> $GITHUB_OUTPUT
          echo "acr_password=$ACR_PASS" >> $GITHUB_OUTPUT

      # --- DEBUG STEP: PROOF THAT TERRAFORM HAS THE VALUE ---
      - name: "7. Debug Outputs"
        run: |
          echo "--- CHECKING CAPTURED VARIABLES ---"
          echo "Web App Name: ${{ steps.apply.outputs.webapp_name }}"
          echo "ACR Server: ${{ steps.apply.outputs.acr_login_server }}"
          
          if [ -z "${{ steps.apply.outputs.acr_login_server }}" ]; then
            echo "❌ FAILURE: Terraform did not output 'acr_login_server'."
            echo "Check your output.tf file!"
            exit 1
          else
            echo "✅ SUCCESS: Terraform found the ACR Server."
          fi