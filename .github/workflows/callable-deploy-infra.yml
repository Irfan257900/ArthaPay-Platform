name: "Reusable: Deploy Infrastructure"

on:
  workflow_call:
    inputs:
      client_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      # --- FIX: Get username as input, password as secret ---
      vm_admin_username:
        type: string
        required: true
      auth0_domain:
        type: string
        required: true
      mailgun_key:
        type: string
        required: true
      twilio_sid:
        type: string
        required: true
    
    outputs:
      vm_rg_name:
        value: ${{ jobs.deploy-infra.outputs.VM_RG_NAME }}
      vm_name:
        value: ${{ jobs.deploy-infra.outputs.VM_NAME }}
      static_web_app_api_key:
        value: ${{ jobs.deploy-infra.outputs.SWA_DEPLOY_TOKEN }}
      static_web_app_url:
        value: ${{ jobs.deploy-infra.outputs.SWA_URL }}

    secrets:
      AZURE_CREDENTIALS:
        required: true
      # --- FIX: Get password from secrets ---
      VM_ADMIN_PASSWORD:
        required: true

jobs:
  deploy-infra:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    
    environment:
      name: ${{ inputs.client_name }}-${{ inputs.environment }}

    outputs:
      VM_RG_NAME: "rg-${{ inputs.client_name }}-${{ inputs.environment }}-vm"
      VM_NAME: "${{ inputs.client_name }}-${{ inputs.environment }}-sqlvm"
      SWA_DEPLOY_TOKEN: ${{ steps.apply.outputs.static_web_app_api_key }}
      SWA_URL: ${{ steps.apply.outputs.static_web_app_url }}

    defaults:
      run:
        working-directory: ./infranew/environments/deploy_template

    steps:
      - name: "1. Check out Infrastructure Code"
        uses: actions/checkout@v4

      - name: "2. Log in to Azure"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "3. Setup Terraform"
        uses: hashicorp/setup-terraform@v3

      - name: "4. Terraform Init"
        id: init
        env:
          STATE_FILE_KEY: "${{ inputs.client_name }}-${{ inputs.environment }}.terraform.tfstate"
        run: |
          echo "Initializing Terraform for state file: $STATE_FILE_KEY"
          terraform init -backend-config="key=$STATE_FILE_KEY"

      - name: "5. Terraform Plan"
        id: plan
        env:
          TF_VAR_client_name: ${{ inputs.client_name }}
          TF_VAR_environment_name: ${{ inputs.environment }}
          # --- FIX: Use input for username, secret for password ---
          TF_VAR_vm_admin_username: ${{ inputs.vm_admin_username }}
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_auth0_domain: ${{ inputs.auth0_domain }}
          TF_VAR_mailgun_key: ${{ inputs.mailgun_key }}
          TF_VAR_twilio_sid: ${{ inputs.twilio_sid }}
        run: terraform plan -out=tfplan

      - name: "6. Terraform Apply"
        id: apply
        env:
          TF_VAR_client_name: ${{ inputs.client_name }}
          TF_VAR_environment_name: ${{ inputs.environment }}
          TF_VAR_vm_admin_username: ${{ inputs.vm_admin_username }}
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_auth0_domain: ${{ inputs.auth0_domain }}
          TF_VAR_mailgun_key: ${{ inputs.mailgun_key }}
          TF_VAR_twilio_sid: ${{ inputs.twilio_sid }}
        run: |
          terraform apply -auto-approve tfplan
          
          echo "static_web_app_api_key=$(terraform output -raw static_web_app_api_key)" >> $GITHUB_OUTPUT
          echo "static_web_app_url=$(terraform output -raw static_web_app_url)" >> $GITHUB_OUTPUT
          echo "vm_name=$(terraform output -raw vm_name)" >> $GITHUB_OUTPUT
          echo "vm_rg_name=$(terraform output -raw vm_rg_name)" >> $GITHUB_OUTPUT