name: "Reusable: Deploy Infrastructure"

on:
  workflow_call:
    inputs:
      client_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      vm_admin_username:
        type: string
        required: true
      auth0_domain:
        type: string
        required: true
      mailgun_key:
        type: string
        required: true
      twilio_sid:
        type: string
        required: true
    
    outputs:
      vm_rg_name:
        value: ${{ jobs.deploy-infra.outputs.vm_rg_name }}
      vm_name:
        value: ${{ jobs.deploy-infra.outputs.vm_name }}
      ui_app_name:
        value: ${{ jobs.deploy-infra.outputs.ui_app_name }}
      ui_admin_name:
        value: ${{ jobs.deploy-infra.outputs.ui_admin_name }}
      webapp_rg_name:
        value: ${{ jobs.deploy-infra.outputs.webapp_rg_name }}

    secrets:
      AZURE_CREDENTIALS:
        required: true
      VM_ADMIN_PASSWORD:
        required: true
      APP_SQL_PASSWORD:
        required: true

jobs:
  deploy-infra:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.client_name }}-${{ inputs.environment }}

    outputs:
      vm_rg_name: ${{ steps.apply.outputs.vm_rg_name }}
      vm_name: ${{ steps.apply.outputs.vm_name }}
      ui_app_name: ${{ steps.apply.outputs.ui_app_name }}
      ui_admin_name: ${{ steps.apply.outputs.ui_admin_name }}
      webapp_rg_name: ${{ steps.apply.outputs.webapp_rg_name }}

    defaults:
      run:
        working-directory: ./infranew/environments/deploy_template

    steps:
      - name: "1. Check out Code"
        uses: actions/checkout@v4

      - name: "2. Log in to Azure"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "3. Setup Terraform"
        uses: hashicorp/setup-terraform@v3

      - name: "4. Terraform Init"
        env:
          STATE_FILE_KEY: "${{ inputs.client_name }}-${{ inputs.environment }}.terraform.tfstate"
        run: terraform init -backend-config="key=$STATE_FILE_KEY"

      - name: "5. Terraform Plan"
        env:
          TF_VAR_client_name: ${{ inputs.client_name }}
          TF_VAR_environment_name: ${{ inputs.environment }}
          TF_VAR_vm_admin_username: ${{ inputs.vm_admin_username }}
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_auth0_domain: ${{ inputs.auth0_domain }}
          TF_VAR_mailgun_key: ${{ inputs.mailgun_key }}
          TF_VAR_twilio_sid: ${{ inputs.twilio_sid }}
          TF_VAR_app_sql_password: ${{ secrets.APP_SQL_PASSWORD }}
        run: terraform plan -out=tfplan

      - name: "6. Terraform Apply"
        id: apply
        env:
          TF_VAR_client_name: ${{ inputs.client_name }}
          TF_VAR_environment_name: ${{ inputs.environment }}
          TF_VAR_vm_admin_username: ${{ inputs.vm_admin_username }}
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_auth0_domain: ${{ inputs.auth0_domain }}
          TF_VAR_mailgun_key: ${{ inputs.mailgun_key }}
          TF_VAR_twilio_sid: ${{ inputs.twilio_sid }}
          TF_VAR_app_sql_password: ${{ secrets.APP_SQL_PASSWORD }}
        run: |
          terraform apply -auto-approve tfplan
          
          # --- CAPTURE OUTPUTS ---
          echo "vm_name=$(terraform output -raw vm_name)" >> $GITHUB_OUTPUT
          echo "vm_rg_name=$(terraform output -raw vm_rg_name)" >> $GITHUB_OUTPUT
          echo "ui_app_name=$(terraform output -raw ui_app_name)" >> $GITHUB_OUTPUT
          echo "ui_admin_name=$(terraform output -raw ui_admin_name)" >> $GITHUB_OUTPUT
          echo "webapp_rg_name=$(terraform output -raw webapp_rg_name)" >> $GITHUB_OUTPUT