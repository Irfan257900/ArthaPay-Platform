name: "Reusable: Configure SQL Database"

on:
  workflow_call:
    inputs:
      client_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      vm_rg_name:
        type: string
        required: true
      vm_name:
        type: string
        required: true
      vm_admin_username:
        type: string
        required: true
    
    secrets:
      AZURE_CREDENTIALS:
        required: true
      VM_ADMIN_PASSWORD:
        required: true
      APP_SQL_PASSWORD:
        required: true

jobs:
  configure-sql:
    name: "Install and Configure SQL Database"
    
    # =================== FIX #1 ===================
    # Use the stable ubuntu-22.04 runner
    runs-on: ubuntu-22.04
    # ==============================================

    environment:
      name: ${{ inputs.client_name }}-${{ inputs.environment }}

    steps:
      # =================== FIX #2 ===================
      # NEW STEP: Manually purge the bad, cached module
      - name: "1. Purge Old Az Modules"
        shell: pwsh
        run: |
          Write-Host "Force-removing cached Az modules from /usr/share/..."
          Remove-Module -Name Az -Force -ErrorAction SilentlyContinue
          Remove-Item -Path /usr/share/az_* -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Old modules purged."
      # ==============================================

      - name: "2. Log in to Azure"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true 

      # =========================================================================
      # STEP 3: Install SQL Server on the VM
      # =========================================================================
      - name: "3. Install SQL Server Express 2022"
        uses: azure/powershell@v2
        with:
          inlineScript: |
            Write-Host "Starting SQL Server Express 2022 installation on VM..."

            $installSqlScript = @"
            `$ErrorActionPreference = "Stop"
            Write-Host "Running as user: $(whoami)"
            
            # 1. Define paths
            `$tempDir = "C:\Temp"
            `$installerPath = "`$tempDir\SQLEXPR_x64_ENU.exe"
            
            # 2. Create temp directory
            if (-not (Test-Path `$tempDir)) {
                New-Item -Path `$tempDir -ItemType Directory
            }
            
            # 3. Download SQL Server Express 2022
            Write-Host "Downloading SQL Server Express..."
            `$downloader = New-Object System.Net.WebClient
            `$downloader.DownloadFile("https://go.microsoft.com/fwlink/?linkid=2216035", `$installerPath)
            Write-Host "Download complete."
            
            # 4. Run the silent installer
            Write-Host "Starting silent installation... This will take several minutes."
            Start-Process -FilePath `$installerPath -ArgumentList `
              "/Q", `
              "/IACCEPTSQLSERVERLICENSETERMS", `
              "/ACTION=Install", `
              "/FEATURES=SQLEngine", `
              "/INSTANCENAME=SQLEXPRESS", `
              "/TCPENABLED=1", `
              "/SQLSVCACCOUNT=`"NT AUTHORITY\SYSTEM`"", `
              "/SQLSYSADMINACCOUNTS=`"BUILTIN\Administrators`"" -Wait
            
            Write-Host "✅ SQL Server installation process finished."
            
            # 5. Wait for the SQL service to be ready
            Write-Host "Waiting for SQL Server service (MSSQL\$SQLEXPRESS) to start..."
            `$service = Get-Service -Name "MSSQL`$SQLEXPRESS" -ErrorAction SilentlyContinue
            `$timeout = 300 # 5 minutes
            `$watch = [System.Diagnostics.Stopwatch]::StartNew()

            while (`$service.Status -ne 'Running') {
                if (`$watch.Elapsed.TotalSeconds -gt `$timeout) {
                    throw "Timeout: SQL Server service did not start."
                }
                Write-Host "Service status: `$($service.Status)... waiting 5s."
                Start-Sleep -Seconds 5
                `$service.Refresh()
            }
            Write-Host "✅ SQL Server service is running."
            "@
            
            # Convert password to SecureString
            $RunAsPassword = $env:SQL_ADMIN_PASS | ConvertTo-SecureString -AsPlainText -Force
            
            # Run the installation script on the VM
            Invoke-AzVMRunCommand `
              -ResourceGroupName "${{ inputs.vm_rg_name }}" `
              -VMName "${{ inputs.vm_name }}" `
              -CommandId 'RunPowerShellScript' `
              -ScriptString $installSqlScript `
              -RunAsUserName "$($env:SQL_ADMIN_USER)" `
              -RunAsPassword $RunAsPassword
          
          azPSVersion: "latest"
        env:
          SQL_ADMIN_USER: ${{ inputs.vm_admin_username }}
          SQL_ADMIN_PASS: ${{ secrets.VM_ADMIN_PASSWORD }}

      # =========================================================================
      # STEP 4: Run SQL Configuration Script
      # =========================================================================
      - name: "4. Run SQL Configuration Script"
        uses: azure/powershell@v2
        with:
          inlineScript: |
            Write-Host "Starting SQL Server configuration..."
            
            $ClientName = "${{ inputs.client_name }}"
            $DbName = "$($ClientName)DB" # e.g., "demoDB"
            $DbUser = "$($ClientName)_app_user" # e.g., "demo_app_user"

            # This script will be run *as* the VM Administrator
            $scriptBlock = @"
            Write-Host '========================================='
            Write-Host 'Starting SQL Server Database Configuration'
            Write-Host "Running as user: $(whoami)"
            
            `$ErrorActionPreference = "Stop"

            # Define SQL commands
            `$createDbQuery = "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$DbName') BEGIN CREATE DATABASE $DbName; END"
            `$createLoginQuery = "IF NOT EXISTS (SELECT name FROM sys.server_principals WHERE name = N'$DbUser') BEGIN CREATE LOGIN $DbUser WITH PASSWORD = '$($env:SQL_APP_PASS)'; END"
            `$createUserQuery = "USE $DbName; IF NOT EXISTS (SELECT name FROM sys.database_principals WHERE name = N'$DbUser') BEGIN CREATE USER $DbUser FOR LOGIN $DbUser; ALTER ROLE db_owner ADD MEMBER $DbUser; END"

            try {
                Write-Host "Step 1: Creating database $DbName..."
                sqlcmd.exe -S localhost\SQLEXPRESS -E -Q "`$createDbQuery" -b
                if (`$LASTEXITCODE -ne 0) { throw "sqlcmd failed on step 1." }
                Write-Host "Database $DbName created or already exists."

                Write-Host "Step 2: Creating login $DbUser..."
                sqlcmd.exe -S localhost\SQLEXPRESS -E -Q "`$createLoginQuery" -b
                if (`$LASTEXITCODE -ne 0) { throw "sqlcmd failed on step 2." }
                Write-Host "Login $DbUser created or already exists."

                Write-Host "Step 3: Creating database user and assigning permissions..."
                sqlcmd.exe -S localhost\SQLEXPRESS -E -Q "`$createUserQuery" -b
                if (`$LASTEXITCODE -ne 0) { throw "sqlcmd failed on step 3." }
                Write-Host "User $DbUser configured in $DbName."

                Write-Host '✅ SQL configuration completed successfully!'
            }
            catch {
                Write-Host '❌ SQL CONFIGURATION FAILED'
                Write-Host "Error: $($_.Exception.Message)"
                exit 1 # Exit with an error code
            }
            "@
            
            echo "Sending configuration script to VM..."
            
            $RunAsPassword = $env:SQL_ADMIN_PASS | ConvertTo-SecureString -AsPlainText -Force
            
            Invoke-AzVMRunCommand `
              -ResourceGroupName "${{ inputs.vm_rg_name }}" `
              -VMName "${{ inputs.vm_name }}" `
              -CommandId 'RunPowerShellScript' `
              -ScriptString $scriptBlock `
              -RunAsUserName "$($env:SQL_ADMIN_USER)" `
              -RunAsPassword $RunAsPassword
          
          azPSVersion: "latest"
        env:
          SQL_ADMIN_USER: ${{ inputs.vm_admin_username }}
          SQL_ADMIN_PASS: ${{ secrets.VM_ADMIN_PASSWORD }}
          APP_SQL_PASSWORD: ${{ secrets.APP_SQL_PASSWORD }}