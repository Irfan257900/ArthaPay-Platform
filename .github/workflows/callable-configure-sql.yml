name: "Reusable: Configure SQL Database"

on:
  workflow_call:
    inputs:
      client_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      vm_rg_name:
        type: string
        required: true
      vm_name:
        type: string
        required: true
      vm_admin_username:
        type: string
        required: true
    
    secrets:
      AZURE_CREDENTIALS:
        required: true
      VM_ADMIN_PASSWORD:
        required: true
      APP_SQL_PASSWORD:
        required: true

jobs:
  configure-sql:
    name: "Configure SQL Database"
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.client_name }}-${{ inputs.environment }}

    steps:
      - name: "1. Log in to Azure"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          # We don't need enable-AzPSSession, we are using Azure CLI
          
      - name: "2. Create and Run SQL Configuration Script"
        # --- FIX: This step now runs in BASH ---
        shell: bash
        run: |
          echo "Preparing SQL script..."
          
          # 1. Create the PowerShell script locally
          # This script will be sent to the VM
          cat > db_setup.ps1 << 'EOF'
          # This script will run INSIDE the VM *as the admin user*
          param(
              [string]$AppPass,
              [string]$DbName,
              [string]$DbUser
          )

          Write-Host '========================================='
          Write-Host "Starting SQL Server Database Configuration as user: $(whoami)"
          $ErrorActionPreference = "Stop"

          # Define SQL commands
          $createDbQuery = "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$DbName') BEGIN CREATE DATABASE $DbName; END"
          $createLoginQuery = "IF NOT EXISTS (SELECT name FROM sys.server_principals WHERE name = N'$DbUser') BEGIN CREATE LOGIN $DbUser WITH PASSWORD = '$AppPass'; END"
          $createUserQuery = "USE $DbName; IF NOT EXISTS (SELECT name FROM sys.database_principals WHERE name = N'$DbUser') BEGIN CREATE USER $DbUser FOR LOGIN $DbUser; ALTER ROLE db_owner ADD MEMBER $DbUser; END"

          try {
              Write-Host "Step 1: Creating database $DbName..."
              # --- FIX: Use -E (Windows Auth) ---
              # This now works because the *script itself* is running as the admin
              sqlcmd.exe -S localhost -E -Q "$createDbQuery" -b
              if ($LASTEXITCODE -ne 0) { throw "sqlcmd failed on step 1." }
              Write-Host "Database $DbName created or already exists."

              Write-Host "Step 2: Creating login $DbUser..."
              sqlcmd.exe -S localhost -E -Q "$createLoginQuery" -b
              if ($LASTEXITCODE -ne 0) { throw "sqlcmd failed on step 2." }
              Write-Host "Login $DbUser created or already exists."

              Write-Host "Step 3: Creating database user and assigning permissions..."
              sqlcmd.exe -S localhost -E -Q "$createUserQuery" -b
              if ($LASTEXITCODE -ne 0) { throw "sqlcmd failed on step 3." }
              Write-Host "User $DbUser configured in $DbName."

              Write-Host '✅ SQL configuration completed successfully!'
          }
          catch {
              Write-Host '❌ SQL CONFIGURATION FAILED'
              Write-Host "Error: $($_.Exception.Message)"
              exit 1 # Exit with an error code
          }
          EOF
          
          echo "Sending script to VM..."
          
          # 2. Use Azure CLI to send the script and parameters
          # --- FIX: Use 'az vm run-command invoke' with correct parameters ---
          az vm run-command invoke \
            -g "${{ inputs.vm_rg_name }}" \
            -n "${{ inputs.vm_name }}" \
            --command-id RunPowerShellScript \
            --scripts @db_setup.ps1 \
            --run-as-user "$SQL_ADMIN_USER" \
            --run-as-password "$SQL_ADMIN_PASS" \
            --parameters \
              AppPass="$SQL_APP_PASS" \
              DbName="${{ inputs.client_name }}DB" \
              DbUser="${{ inputs.client_name }}_app_user"
              
        env:
          SQL_ADMIN_USER: ${{ inputs.vm_admin_username }}
          SQL_ADMIN_PASS: ${{ secrets.VM_ADMIN_PASSWORD }}
          SQL_APP_PASS: ${{ secrets.APP_SQL_PASSWORD }}