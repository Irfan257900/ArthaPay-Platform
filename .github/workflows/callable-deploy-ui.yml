name: "Reusable: Deploy React UI"

on:
  workflow_call:
    inputs:
      client_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      client_domain_extension:
        type: string
        required: true
      swa_deploy_token:
        type: string
        required: true
      auth0_domain:
        type: string
        required: true
      auth0_client_id:
        type: string
        required: true
    secrets:
      # --- FIX: Accept credentials ---
      AZURE_CREDENTIALS:
        required: true

jobs:
  deploy-ui:
    name: "Deploy React UI"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ArthapayUI 

    steps:
      - name: "1. Check out Application Code"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js (v18)"
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: "3. Install NPM Dependencies"
        run: npm install --force

      - name: "4. Set Dynamic Variables"
        id: vars
        shell: bash
        run: |
          # 1. Normalize inputs
          CLIENT=$(echo "${{ inputs.client_name }}" | tr '[:upper:]' '[:lower:]')
          ENV=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          EXT=$(echo "${{ inputs.client_domain_extension }}" | tr '[:upper:]' '[:lower:]')
          
          # 2. Define Base Domain
          BASE_DOMAIN="${CLIENT}.${EXT}"
          
          # 3. Construct URLs
          APP_URL="https://${CLIENT}${ENV}payments.${BASE_DOMAIN}"
          ADMIN_URL="https://${CLIENT}${ENV}admin.${BASE_DOMAIN}"
          
          CORE_API_URL="https://${CLIENT}${ENV}core.${BASE_DOMAIN}"
          PAYMENTS_API="https://${CLIENT}${ENV}payments.${BASE_DOMAIN}"
          EXCHANGE_API="https://${CLIENT}${ENV}exchange.${BASE_DOMAIN}"
          BANKS_API="https://${CLIENT}${ENV}banks.${BASE_DOMAIN}"
          CARDS_API="https://${CLIENT}${ENV}cards.${BASE_DOMAIN}"
          NOTIFICATIONS_API="https://${CLIENT}${ENV}core.${BASE_DOMAIN}"
          
          # 4. Build Script
          if [ "$ENV" == "tst" ]; then
            BUILD_ENV="testing"
          elif [ "$ENV" == "stg" ]; then
            BUILD_ENV="staging"
          elif [ "$ENV" == "prd" ]; then
            BUILD_ENV="production" 
          else
            BUILD_ENV=$ENV
          fi
          
          BUILD_SCRIPT="build:artha:${BUILD_ENV}"
          
          # 5. Auth0 Audience
          AUTH0_DOMAIN="${{ inputs.auth0_domain }}"
          AUDIENCE="https://$(echo $AUTH0_DOMAIN | cut -d'.' -f1)Api.net"

          # 6. Output everything
          echo "CLIENT=$CLIENT" >> $GITHUB_OUTPUT
          echo "ENV=$ENV" >> $GITHUB_OUTPUT
          echo "BUILD_SCRIPT=$BUILD_SCRIPT" >> $GITHUB_OUTPUT
          echo "APP_URL=$APP_URL" >> $GITHUB_OUTPUT
          echo "ADMIN_URL=$ADMIN_URL" >> $GITHUB_OUTPUT
          echo "CORE_API_URL=$CORE_API_URL" >> $GITHUB_OUTPUT
          echo "PAYMENTS_API=$PAYMENTS_API" >> $GITHUB_OUTPUT
          echo "EXCHANGE_API=$EXCHANGE_API" >> $GITHUB_OUTPUT
          echo "BANKS_API=$BANKS_API" >> $GITHUB_OUTPUT
          echo "CARDS_API=$CARDS_API" >> $GITHUB_OUTPUT
          echo "NOTIFICATIONS_API=$NOTIFICATIONS_API" >> $GITHUB_OUTPUT
          echo "VITE_AUDIENCE=$AUDIENCE" >> $GITHUB_OUTPUT
          
          # Resource Names (needed for CLI)
          echo "SWA_NAME=${CLIENT}-${ENV}-ui" >> $GITHUB_OUTPUT
          echo "RG_NAME=rg-${CLIENT}-${ENV}-apps" >> $GITHUB_OUTPUT

      - name: "5. Generate .env File (Build-Time)"
        shell: bash
        run: |
          echo "Creating minimal build-time .env..."
          cat <<EOF > .env
          VITE_CLIENT=${{ steps.vars.outputs.CLIENT }}
          VITE_NODE_ENV=production
          VITE_CLIENT_NAME="${{ inputs.client_name }}" 
          EOF
          cat .env

      - name: "6. Build React App"
        run: |
          SCRIPT="${{ steps.vars.outputs.BUILD_SCRIPT }}"
          echo "Running build script: npm run $SCRIPT"
          npm run $SCRIPT
      
      # --- FIX START: Log in to Azure to enable CLI commands ---
      - name: "7. Log in to Azure"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # --- FIX END ---

      - name: "8. Deploy to SWA"
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ inputs.swa_deploy_token }}
          app_location: "ArthapayUI/dist" 
          skip_app_build: true
          skip_api_build: true
          api_location: ""
          action: "upload"
          
      # --- FIX START: Explicitly set Environment Variables in Portal ---
      - name: "9. Push Env Vars to Azure Portal"
        shell: bash
        run: |
          echo "Pushing environment variables to Static Web App Configuration..."
          
          az staticwebapp appsettings set \
            --name "${{ steps.vars.outputs.SWA_NAME }}" \
            --resource-group "${{ steps.vars.outputs.RG_NAME }}" \
            --setting-names \
              "CLIENT=${{ steps.vars.outputs.CLIENT }}" \
              "ENV=${{ steps.vars.outputs.ENV }}" \
              "VITE_CLIENT=${{ steps.vars.outputs.CLIENT }}" \
              "VITE_REDIRECT_URI=${{ steps.vars.outputs.APP_URL }}/callback" \
              "VITE_CLIENT_ID=${{ inputs.auth0_client_id }}" \
              "VITE_AUTHORITY=${{ inputs.auth0_domain }}" \
              "VITE_AUDIENCE=${{ steps.vars.outputs.VITE_AUDIENCE }}" \
              "VITE_SILENT_REDIRECT_URI=${{ steps.vars.outputs.APP_URL }}/silent_redirect" \
              "VITE_CORE_API_END_POINT=${{ steps.vars.outputs.CORE_API_URL }}" \
              "VITE_APP_URL=${{ steps.vars.outputs.APP_URL }}" \
              "VITE_ADMIN_URL=${{ steps.vars.outputs.ADMIN_URL }}" \
              "VITE_API_END_POINT=${{ steps.vars.outputs.CORE_API_URL }}/api/v1" \
              "VITE_API_PAYMENTS_END_POINT=${{ steps.vars.outputs.PAYMENTS_API }}" \
              "VITE_API_NOTIFICATIONS_END_POINT=${{ steps.vars.outputs.NOTIFICATIONS_API }}" \
              "VITE_API_EXCHANGE_END_POINT=${{ steps.vars.outputs.EXCHANGE_API }}" \
              "VITE_API_BANKS_END_POINT=${{ steps.vars.outputs.BANKS_API }}" \
              "VITE_API_CARDS_END_POINT=${{ steps.vars.outputs.CARDS_API }}" \
              "VITE_NODE_ENV=production" \
              "VITE_IPSTACK_API=https://api.ipstack.com"
      # --- FIX END ---