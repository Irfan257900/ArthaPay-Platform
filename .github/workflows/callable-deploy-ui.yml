name: "Reusable: Deploy React UI"

on:
  workflow_call:
    inputs:
      client_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      swa_deploy_token:
        type: string
        required: true
      auth0_domain:
        type: string
        required: true
      auth0_client_id:
        type: string
        required: true
    secrets: {} # Secrets are passed via inputs

jobs:
  deploy-ui:
    name: "Deploy React UI"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ArthapayUI 

    steps:
      - name: "1. Check out Application Code"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js (v18)"
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: "3. Install NPM Dependencies"
        run: npm install --force

      - name: "4. Set Dynamic Names"
        id: vars
        shell: bash
        run: |
          CLIENT_LOWER=$(echo "${{ inputs.client_name }}" | tr '[:upper:]' '[:lower:]')
          ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          
          if [ "$ENV_LOWER" == "tst" ]; then
            BUILD_ENV="testing"
          elif [ "$ENV_LOWER" == "stg" ]; then
            BUILD_ENV="staging"
          elif [ "$ENV_LOWER" == "prd" ]; then
            BUILD_ENV="production" 
          else
            BUILD_ENV=$ENV_LOWER
          fi
          
          BUILD_BRAND="artha"
          BUILD_SCRIPT="build:${BUILD_BRAND}:${BUILD_ENV}"
          
          # --- THIS IS THE FIX (Part 1) ---
          # Pre-calculate the dynamic Audience value
          AUTH0_DOMAIN="${{ inputs.auth0_domain }}"
          AUDIENCE="https://$(echo $AUTH0_DOMAIN | cut -d'.' -f1)Api.net"
          
          echo "BUILD_SCRIPT=$BUILD_SCRIPT" >> $GITHUB_OUTPUT
          echo "CLIENT_LOWER=$CLIENT_LOWER" >> $GITHUB_OUTPUT
          echo "ENV_LOWER=$ENV_LOWER" >> $GITHUB_OUTPUT
          echo "VITE_AUDIENCE=$AUDIENCE" >> $GITHUB_OUTPUT # Save it as an output

      - name: "5. Generate .env File (for Build-Time)"
        shell: bash
        run: |
          # This .env file is ONLY for variables used during the build
          # (like in your index.html)
          echo "Creating minimal .env file for build..."
          
          cat <<EOF > .env
          VITE_CLIENT=${{ steps.vars.outputs.CLIENT_LOWER }}
          VITE_NODE_ENV=production
          VITE_CLIENT_NAME="Artha Pay"
          VITE_CLIENT_FAVICON="https://devtstarthaone.blob.core.windows.net/arthaimages/artha_fav.svg"
          VITE_CLIENT_META_DESCRIPTION="ArthaPay Platform"
          EOF
          
          echo "--- .env file created ---"
          cat .env
          echo "-------------------------"

      - name: "6. Build React App"
        run: |
          SCRIPT="${{ steps.vars.outputs.BUILD_SCRIPT }}"
          echo "Running build script: npm run $SCRIPT"
          npm run $SCRIPT

      - name: "7. Deploy to SWA (and Set Run-Time Env Vars)"
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ inputs.swa_deploy_token }}
          app_location: "ArthapayUI/dist" 
          skip_app_build: true
          skip_api_build: true
          api_location: ""
          action: "upload"
          
        # --- THIS IS THE FIX (Part 2) ---
        # This 'env:' block is now 100% clean, simple text
        # and will be correctly added to your Azure "Environment variables"
        env:
          # --- Set the Application Environment Variables ---
          VITE_CLIENT: "${{ steps.vars.outputs.CLIENT_LOWER }}"
          VITE_REDIRECT_URI: "https://photos.google.com/"
          VITE_CLIENT_ID: "${{ inputs.auth0_client_id }}"
          VITE_AUTHORITY: "${{ inputs.auth0_domain }}"
          VITE_AUDIENCE: "${{ steps.vars.outputs.VITE_AUDIENCE }}" # Use the clean output
          VITE_SILENT_REDIRECT_URI: "https://photos.google.com/"
          VITE_CORE_API_END_POINT: "https://${{ steps.vars.outputs.CLIENT_LOWER }}${{ steps.vars.outputs.ENV_LOWER }}core.${{ steps.vars.outputs.CLIENT_LOWER }}.work"
          VITE_APP_URL: "https://photos.google.com/"
          VITE_ADMIN_URL: "https://${{ steps.vars.outputs.CLIENT_LOWER }}payadmin.${{ steps.vars.outputs.CLIENT_LOWER }}.work"
          VITE_API_END_POINT: "https://photos.google.com/"
          VITE_API_PAYMENTS_END_POINT: "https://${{ steps.vars.outputs.CLIENT_LOWER }}${{ steps.vars.outputs.ENV_LOWER }}payments.${{ steps.vars.outputs.CLIENT_LOWER }}.work"
          VITE_API_NOTIFICATIONS_END_POINT: "https://${{ steps.vars.outputs.CLIENT_LOWER }}${{ steps.vars.outputs.ENV_LOWER }}core.${{ steps.vars.outputs.CLIENT_LOWER }}.work"
          VITE_API_EXCHANGE_END_POINT: "https://photos.google.com/"
          VITE_API_BANKS_END_POINT: "https://${{ steps.vars.outputs.CLIENT_LOWER }}${{ steps.vars.outputs.ENV_LOWER }}banks.${{ steps.vars.outputs.CLIENT_LOWER }}.work"
          VITE_API_CARDS_END_POINT: "https://photos.google.com/"
          VITE_NODE_ENV: "production"
          
          # --- Add the build-time variables too, just in case ---
          VITE_CLIENT_NAME: "Artha Pay"
          VITE_CLIENT_FAVICON: "https://devtstarthaone.blob.core.windows.net/arthaimages/artha_fav.svg"
          VITE_CLIENT_META_DESCRIPTION: "ArthaPay Platform"