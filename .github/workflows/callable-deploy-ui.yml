name: "Reusable: Deploy React UI"

on:
  workflow_call:
    inputs:
      client_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      swa_deploy_token:
        type: string
        required: true
      # New inputs passed from Master
      auth0_domain:
        type: string
        required: true
      auth0_client_id:
        type: string
        required: true

jobs:
  deploy-ui:
    name: "Deploy React UI"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ArthapayUI 

    steps:
      - name: "1. Check out Application Code"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js (v18)"
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: "3. Install NPM Dependencies"
        run: npm install --force

      - name: "4. Set Dynamic Names"
        id: vars
        shell: bash
        run: |
          # Convert inputs to lowercase (e.g., Artha -> artha)
          CLIENT_LOWER=$(echo "${{ inputs.client_name }}" | tr '[:upper:]' '[:lower:]')
          ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          
          # Map env inputs to build script names (tst -> testing)
          if [ "$ENV_LOWER" == "tst" ]; then
            BUILD_ENV="testing"
          elif [ "$ENV_LOWER" == "stg" ]; then
            BUILD_ENV="staging"
          elif [ "$ENV_LOWER" == "prd" ]; then
            BUILD_ENV="production"
          else
            BUILD_ENV="$ENV_LOWER"
          fi

          echo "CLIENT_LOWER=$CLIENT_LOWER" >> $GITHUB_OUTPUT
          echo "ENV_LOWER=$ENV_LOWER" >> $GITHUB_OUTPUT
          echo "BUILD_ENV=$BUILD_ENV" >> $GITHUB_OUTPUT
          echo "BUILD_SCRIPT=build:${CLIENT_LOWER}:${BUILD_ENV}" >> $GITHUB_OUTPUT

      - name: "5. Generate Dynamic .env File"
        shell: bash
        run: |
          # This step creates the .env file based on your sample
          CLIENT="${{ steps.vars.outputs.CLIENT_LOWER }}"
          ENV="${{ steps.vars.outputs.ENV_LOWER }}"
          
          # Construct URLs dynamically. 
          # Example: https://arthatstpayments.artha.work
          APP_URL="https://${CLIENT}payments.${CLIENT}.work"
          CORE_API="https://${CLIENT}${ENV}core.${CLIENT}.work"
          
          echo "Creating .env file..."
          
          # Write to .env
          cat <<EOF > .env
          VITE_CLIENT=$CLIENT
          VITE_REDIRECT_URI=$APP_URL/callback
          VITE_CLIENT_ID=${{ inputs.auth0_client_id }}
          VITE_AUTHORITY=${{ inputs.auth0_domain }}
          VITE_AUDIENCE=https://$(echo ${{ inputs.auth0_domain }} | cut -d'.' -f1)Api.net
          VITE_SILENT_REDIRECT_URI=$APP_URL/silent_redirect
          
          VITE_CORE_API_END_POINT=$CORE_API
          VITE_APP_URL=$APP_URL
          VITE_ADMIN_URL=https://${CLIENT}payadmin.${CLIENT}.work
          
          VITE_API_END_POINT=https://${CLIENT}payapi.${CLIENT}.work/api/v1
          VITE_API_PAYMENTS_END_POINT=https://${CLIENT}${ENV}payments.${CLIENT}.work
          VITE_API_NOTIFICATIONS_END_POINT=$CORE_API
          VITE_API_EXCHANGE_END_POINT=https://${CLIENT}${ENV}exchange.${CLIENT}.work
          VITE_API_BANKS_END_POINT=https://${CLIENT}${ENV}banks.${CLIENT}.work
          VITE_API_CARDS_END_POINT=https://${CLIENT}${ENV}cards.${CLIENT}.work
          
          VITE_NODE_ENV=production
          EOF
          
          # Print file for debugging (hide secrets manually if needed, but safe in logs for now)
          cat .env

      - name: "6. Build React App"
        run: |
          SCRIPT="${{ steps.vars.outputs.BUILD_SCRIPT }}"
          echo "Running build script: npm run $SCRIPT"
          npm run $SCRIPT

      - name: "7. Deploy to Static Web App"
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ inputs.swa_deploy_token }}
          app_location: "ArthapayUI/dist" 
          skip_app_build: true
          skip_api_build: true
          api_location: ""
          action: "upload"